
name: Automatisation des tests DevSecOps

on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Scanner les dependances
        run: trivy fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Scanner le Dockerfile
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
